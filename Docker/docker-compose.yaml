version: "3.8"

services:
  # ==========================================
  # ZOOKEEPER
  # Kafka uses Zookeeper for broker coordination in this setup.
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # KAFKA
  # We expose one listener for your host machine and one for Docker network traffic.
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # WHY:
      # PLAINTEXT_HOST = your laptop/terminal
      # PLAINTEXT_INTERNAL = containers inside Docker network
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # POSTGRES
  # Airflow stores metadata here.
  # ==========================================
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparkuser
      POSTGRES_PASSWORD: sparkpass
      POSTGRES_DB: airflowdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkuser -d airflowdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # SPARK MASTER
  # Spark master coordinates the cluster.
  # ==========================================
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    restart: unless-stopped
    env_file:
      - .env
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/opt/project

  # ==========================================
  # SPARK WORKER
  # Spark worker executes the streaming tasks.
  # ==========================================
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - .:/opt/project

  # ==========================================
  # AIRFLOW WEBSERVER
  # Built from custom image so spark-submit and dbt exist inside Airflow.
  # ==========================================
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sparkuser:sparkpass@postgres:5432/airflowdb
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__FERNET_KEY: 1j3rXkY6wZQ9pL2tB5mN8vC0sF7hD4uE9aR6gH1J2KQ=
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/project
      - C:/Users/guruv/.dbt:/home/airflow/.dbt
    ports:
      - "8081:8080"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true &&
      exec airflow webserver
      "

  # ==========================================
  # AIRFLOW SCHEDULER
  # Runs the DAG engine.
  # ==========================================
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile   # file in airflow folder
    container_name: airflow-scheduler # general name
    restart: unless-stopped
    env_file:
      - .env   # credential file where all poassword are stored
    depends_on:
      postgres:
        condition: service_healthy # depends on postgres for metadata storage if postress fail it will also fails
      airflow:
        condition: service_started # depaonds on airflow 
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sparkuser:sparkpass@postgres:5432/airflowdb
      AIRFLOW__CORE__FERNET_KEY: 1j3rXkY6wZQ9pL2tB5mN8vC0sF7hD4uE9aR6gH1J2KQ=
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - .:/opt/project
      - C:/Users/guruv/.dbt:/home/airflow/.dbt
    command: >
      bash -c "
      airflow db migrate &&
      exec airflow scheduler
      "